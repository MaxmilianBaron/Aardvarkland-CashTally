name: Deploy CashTally preview

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'preview.css'
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build public preview artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html preview.css _site/
          cp -R assets _site/assets
          cp -R app _site/app
          touch _site/.nojekyll

      - name: Upload CashTally preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy CashTally preview
        id: deployment
        uses: actions/deploy-pages@v5
