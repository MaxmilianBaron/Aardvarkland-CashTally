name: CashTally UI preview smoke

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'preview.css'
      - 'app/**'
      - 'e2e/**'
      - '.github/workflows/ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Start static preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cashtally-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cashtally-preview.log
          exit 1

      - name: Run UI flows and screenshots
        env:
          PREVIEW_URL: http://127.0.0.1:4173/
        run: npx playwright test e2e/preview.spec.mjs --workers=1 --reporter=line

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashtally-pages-ui-screenshots
          path: artifacts/ui
          if-no-files-found: warn
          retention-days: 30
