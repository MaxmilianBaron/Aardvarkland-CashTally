name: vycetka
description: Cross-platform multi-currency cash counting and closing reports.
publish_to: "none"
version: 0.4.1+20

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_secure_storage: ^10.3.1
  in_app_purchase: ^3.3.0
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^13.3.0
  flutter_file_dialog: ^3.3.1
  google_mobile_ads: ^9.0.0
  url_launcher: ^6.3.2
  cryptography: ^2.9.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/vycetka_logo.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/NotoSansHebrew-Regular.ttf
    - assets/fonts/NotoSansDevanagari-Regular.ttf
    - assets/fonts/NotoSansThai-Regular.ttf
    - assets/fonts/NotoSansJP-Variable.ttf
    - assets/fonts/NotoSansKR-Variable.ttf
    - assets/fonts/OFL.txt

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/vycetka_logo.png
  remove_alpha_ios: true
  min_sdk_android: 24
